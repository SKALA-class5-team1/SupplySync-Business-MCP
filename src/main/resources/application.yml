# [설정] 서버·MCP·백엔드 설정. 값은 프로젝트 루트 .env에서 읽는다.
# 포트 8101, MCP Streamable HTTP, 백엔드 호출 타임아웃. DB에는 접근하지 않는다 (조회·변경 모두 백엔드 /internal/** 호출).

server:
  port: 8101
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: business-mcp
  http:
    client:
      # 백엔드 /internal/** 호출 (RestClient)
      connect-timeout: 3s
      read-timeout: 10s
  ai:
    mcp:
      server:
        name: business-mcp
        protocol: STREAMABLE

internal:
  api-key: ${INTERNAL_API_KEY}

# 모든 Tool이 호출할 Spring 백엔드. 요청 헤더 키는 internal.api-key(INTERNAL_API_KEY)를 그대로 쓴다.
backend:
  url: ${BACKEND_URL:http://localhost:8080}
